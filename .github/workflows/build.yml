# Tells GitHub to rebuild your page every 15 minutes (and whenever you change channels.txt)
name: Build my video page

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
