# Tells GitHub to rebuild your page every hour (and whenever you change channels.txt)
name: Build my video page

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
