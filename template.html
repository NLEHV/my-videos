<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Open connections to YouTube's servers early, so a video starts faster when clicked -->
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.google.com">
  <link rel="preconnect" href="https://static.doubleclick.net">
  <link rel="preconnect" href="https://jnn-pa.googleapis.com">
  <title>My Videos</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --text: #1c1c1c; --muted: #6b6b6b; --accent: #2f6fdf; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161616; --card: #222; --text: #eee; --muted: #9a9a9a; --accent: #7aa7ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
    header { max-width: 1200px; margin: 0 auto; padding: 24px 20px 8px; }
    h1 { margin: 0 0 14px; font-size: 22px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filters button { border: 1px solid var(--muted); background: transparent; color: var(--text);
      padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
    .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 60px; }
    .player { display: none; margin-bottom: 24px; }
    .player.open { display: block; }
    .player iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }
    .player .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
    .player h2 { font-size: 18px; margin: 0; }
    .player button { border: 0; background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .video { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; }
    .video img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--card); }
    .video .title { margin: 8px 0 2px; font-weight: 600; font-size: 15px; line-height: 1.3; }
    .video .meta { color: var(--muted); font-size: 13px; }
    .video.watched img { opacity: .4; }
    .tabs { display: none; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
    .tabs.show { display: flex; }
    .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
      padding: 8px 14px; font-size: 15px; cursor: pointer; margin-bottom: -1px; }
    .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .playlist img { opacity: 1; }
    .empty { color: var(--muted); }
    .back { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
    .back button { border: 0; background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .back h3 { margin: 0; font-size: 17px; }
    .video.watched .title::before { content: "✓ "; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>My Videos</h1>
    <div class="filters" id="filters"></div>
  </header>
  <main>
    <section class="player" id="player">
      <iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="bar">
        <h2 id="playing"></h2>
        <button id="close">Close</button>
      </div>
    </section>
    <div class="tabs" id="tabs">
      <button id="tab-videos" class="active">Videos</button>
      <button id="tab-playlists">Playlists</button>
    </div>
    <div class="back" id="back" hidden>
      <button id="back-button">← All playlists</button>
      <h3 id="back-title"></h3>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const videos = __VIDEOS__;
    const playlists = __PLAYLISTS__;
    const watched = new Set(JSON.parse(localStorage.getItem("watched") || "[]"));
    let currentChannel = "All";
    let currentTab = "videos";
    let openPlaylist = null;   // the playlist whose videos are being shown

    const grid = document.getElementById("grid");
    const filters = document.getElementById("filters");
    const player = document.getElementById("player");
    const frame = document.getElementById("frame");

    function timeAgo(dateString) {
      const days = Math.floor((Date.now() - new Date(dateString)) / 86400000);
      if (days < 1) return "today";
      if (days === 1) return "yesterday";
      if (days < 30) return days + " days ago";
      const months = Math.floor(days / 30);
      return months === 1 ? "1 month ago" : months + " months ago";
    }

    function showFilters() {
      const channels = ["All", ...new Set(videos.map(v => v.channel))];
      filters.innerHTML = "";
      for (const name of channels) {
        const button = document.createElement("button");
        button.textContent = name;
        button.className = name === currentChannel ? "active" : "";
        button.onclick = () => { currentChannel = name; currentTab = "videos"; openPlaylist = null; showFilters(); showVideos(); };
        filters.appendChild(button);
      }
    }

    function makeCard(imageUrl, titleText, metaText, extraClass) {
      const card = document.createElement("button");
      card.className = "video " + extraClass;
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "";
      img.loading = "lazy";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = titleText;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = metaText;
      card.append(img, title, meta);
      grid.appendChild(card);
      return card;
    }

    function showVideos() {
      // Tabs only appear when one channel is picked
      document.getElementById("tabs").classList.toggle("show", currentChannel !== "All");
      document.getElementById("tab-videos").classList.toggle("active", currentTab === "videos");
      document.getElementById("tab-playlists").classList.toggle("active", currentTab === "playlists");
      grid.innerHTML = "";
      document.getElementById("back").hidden = !openPlaylist;

      if (openPlaylist) {
        document.getElementById("back-title").textContent = openPlaylist.title;
        const list = openPlaylist.videos || [];
        if (!list.length) {
          grid.innerHTML = '<p class="empty">The videos in this playlist could not be loaded.</p>';
          const button = document.createElement("button");
          button.textContent = "Play the playlist instead";
          button.onclick = () => playPlaylist(openPlaylist);
          grid.appendChild(button);
        }
        list.forEach((video, index) => {
          const card = makeCard(
            "https://i.ytimg.com/vi/" + video.id + "/mqdefault.jpg",
            video.title,
            (index + 1) + " of " + list.length,
            watched.has(video.id) ? "watched" : "");
          card.onclick = () => play(video, openPlaylist, index);
        });
        return;
      }

      if (currentChannel !== "All" && currentTab === "playlists") {
        const list = playlists[currentChannel] || [];
        if (!list.length) grid.innerHTML = '<p class="empty">This channel has no playlists.</p>';
        for (const playlist of list) {
          const card = makeCard(playlist.thumb, playlist.title, playlist.count || "Playlist", "playlist");
          card.onclick = () => { openPlaylist = playlist; showVideos(); window.scrollTo({ top: 0 }); };
        }
        return;
      }

      for (const video of videos) {
        if (currentChannel !== "All" && video.channel !== currentChannel) continue;
        const card = makeCard(
          "https://i.ytimg.com/vi/" + video.id + "/mqdefault.jpg",
          video.title,
          video.channel + " · " + timeAgo(video.published),
          watched.has(video.id) ? "watched" : "");
        card.onclick = () => play(video);
      }
    }

    function playPlaylist(playlist) {
      frame.src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + playlist.id + "&autoplay=1&rel=0";
      document.getElementById("playing").textContent = playlist.title + " (playlist)";
      player.classList.add("open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("tab-videos").onclick = () => { currentTab = "videos"; openPlaylist = null; showVideos(); };
    document.getElementById("tab-playlists").onclick = () => { currentTab = "playlists"; openPlaylist = null; showVideos(); };
    document.getElementById("back-button").onclick = () => { openPlaylist = null; showVideos(); };

    function play(video, playlist, index) {
      // When played from a playlist, the next video in it starts automatically afterwards
      frame.src = "https://www.youtube-nocookie.com/embed/" + video.id + "?autoplay=1&rel=0"
        + (playlist ? "&list=" + playlist.id + "&index=" + (index + 1) : "");
      document.getElementById("playing").textContent = video.title;
      player.classList.add("open");
      watched.add(video.id);
      localStorage.setItem("watched", JSON.stringify([...watched]));
      showVideos();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("close").onclick = () => {
      frame.src = "";
      player.classList.remove("open");
    };

    showFilters();
    showVideos();
  </script>
</body>
</html>
